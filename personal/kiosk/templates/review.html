<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kiosk · {{ title }}</title>
<link rel="stylesheet" href="/static/katex/katex.min.css">
<link rel="stylesheet" href="/static/kiosk.css">
<script defer src="/static/katex/katex.min.js"></script>
<script defer src="/static/katex/auto-render.min.js"></script>
<script defer src="/static/review.js"></script>
</head>
<body>
<header class="bar">
  <div class="progress" role="progressbar" aria-label="Cards done" aria-valuemin="0"><div id="progress-fill"></div></div>
  <div class="bar-row">
    <span id="where" class="where"></span>
    <span id="count" class="count"></span>
  </div>
</header>

<main id="app">
  <section id="loading" class="screen"><p class="muted">Loading due cards…</p></section>

  <section id="card" class="screen" hidden>
    <div class="card">
      <p id="question" class="text"></p>
      <img id="q-image" alt="" hidden>
      <div id="answer-wrap" hidden>
        <hr>
        <p id="answer" class="text"></p>
        <img id="a-image" alt="" hidden>
        <p id="source" class="muted small"></p>
      </div>
    </div>

    <div id="confidence" class="controls">
      <p class="prompt">How sure are you?</p>
      <div class="row five">
        <button data-conf="1">1</button><button data-conf="2">2</button><button data-conf="3">3</button><button data-conf="4">4</button><button data-conf="5">5</button>
      </div>
      <div class="row-labels"><span>guessing</span><span>certain</span></div>
    </div>

    <div id="rating" class="controls" hidden>
      <p class="prompt">Confidence <b id="conf-shown"></b>. How did you do?</p>
      <div class="row four">
        <button data-rate="again" class="again">Again</button>
        <button data-rate="hard" class="hard">Hard</button>
        <button data-rate="good" class="good">Good</button>
        <button data-rate="easy" class="easy">Easy</button>
      </div>
    </div>
    <p id="toast" class="toast" hidden></p>
  </section>

  <section id="finish" class="screen" hidden>
    <h1 id="finish-title">Done</h1>
    <div class="stats">
      <div><b id="s-reviewed">0</b><span>reviewed</span></div>
      <div><b id="s-accuracy">–</b><span>correct</span></div>
      <div><b id="s-minutes">0</b><span>minutes</span></div>
    </div>
    <div id="weak-wrap" hidden><h2>Missed</h2><ul id="weak" class="list"></ul></div>
    <div id="over-wrap" hidden><h2>Overconfident</h2><p class="muted small">Sure (4–5) but missed.</p><ul id="over" class="list"></ul></div>
    <button id="again-btn" class="wide">Check for more due cards</button>
  </section>

  <section id="error" class="screen" hidden>
    <p id="error-msg" class="error"></p>
    <button id="retry-btn" class="wide">Retry</button>
  </section>
</main>
</body>
</html>
